# Deploys the built app to GitHub Pages.
#
# Not active until Pages is enabled for the repository:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions".
# It only runs when triggered manually (Actions → Deploy to GitHub Pages →
# Run workflow). Once Pages is enabled you can also add `push: branches: [main]`
# under `on:` to deploy on every push.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
